{% extends "base.html" %}
{% block content %}
<h5>Edit Your Profile</h5>
<div class="wrapper">
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-wrapper">
            <label for="{{ field.id_for_label }}" class="is-leftaligned">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
                <p class="base-text">{{ field.errors|striptags }}</p>
            {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="button-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
