<!doctype html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>User Login Page</title>
    <link rel="stylesheet" href="{% static 'stylesheet.css' %}">
</head>
<body>
    {% include "navbar.html" %}
    <div class="site-wrapper">
        {% block content %}
        <h5>Login</h5>
        <div class="wrapper">
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-wrapper">
                    <label for="{{ field.id_for_label }}" class="is-leftaligned">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="base-text">{{ field.errors|striptags }}</p>
                    {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="button-primary">Login</button>
            </form>
        </div>
        {% endblock %}
    </div>
</body>
</html>
