services:
  db:
    image: postgres:latest
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./backend/.env.prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    depends_on:
      - db
    ports:
      - '8000:8000'
    env_file: ./backend/.env.prod
    networks:
      - default
      - SA-network
    volumes:
      - static_volume:/backend/staticfiles
      - media_volume:/backend/media
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8000/health/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A stockzAI worker -l info -Q web
    networks:
      - default
      - SA-network
    env_file: ./backend/.env.prod

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A stockzAI beat -l info
    networks:
      - default
      - SA-network
    env_file: ./backend/.env.prod

  frontend:
    stdin_open: true
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    command: /bin/sh -c "rm -rf /output/* && cp -r /frontend/dist/* /output/"
    env_file: ./frontend/.env.prod
    depends_on:
      - backend
    volumes:
      - frontend_build:/output

  nginx:
    image: nginx:latest
    depends_on:
      - backend
      - frontend
    volumes:
      - static_volume:/backend/staticfiles
      - media_volume:/backend/media
      - frontend_build:/var/www/frontend
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    ports:
      - 80:80
      - 443:443

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  postgres_data:
  static_volume:
  media_volume:
  frontend_build:
  certbot-var:
  certbot-webroot:
  certbot-etc:

networks:
  SA-network:
    external: true
