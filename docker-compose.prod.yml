version: '3'

services:
  db:
    image: sqlite:3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/mysql_data
    env_file:
      - .env.prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    depends_on:
      - db
    command: gunicorn stockzAI.wsgi:application --bind 0.0.0.0:8000
    env_file: .env.prod
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    volumes:
      - ./frontend/build:/usr/share/nginx/html

volumes:
  mysql_data:
  static_volume:
  media_volume:
