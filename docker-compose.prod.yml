
services:
  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./backend/.env.prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    depends_on:
      - db
    command: gunicorn stockzAI.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file: ./backend/.env.prod
    networks:
      - default
      - SA-network
    volumes:
      - static_volume:/backend/static
      - media_volume:/backend/media
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  
  frontend:
    stdin_open: true
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    expose:
      - 80
    ports:
      - 80:80
  
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  SA-network:
    external: true
