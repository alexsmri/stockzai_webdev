# Canonical host: https://stockz.ai (landing page + app + API all on one origin).
# www.stockz.ai and the former app.stockz.ai only redirect to it, so there is exactly one URL per page.
# The certificate in nginx/certs must cover all three names (stockz.ai, www.stockz.ai, app.stockz.ai).

# --- HTTP: ACME challenges, then everything to the canonical https host ---
server {
    listen 80;
    server_name stockz.ai www.stockz.ai app.stockz.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://stockz.ai$request_uri;
    }
}

# --- HTTPS: legacy / alias hosts -> canonical host ---
server {
    listen 443 ssl http2;
    server_name www.stockz.ai app.stockz.ai;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Payment webhooks do not follow redirects. Keep the old webhook URL alive on app.stockz.ai
    # until the endpoint in the payment provider dashboard points at stockz.ai, then delete this block.
    location = /api/users/payments/webhook/ {
        proxy_pass http://backend:8000/api/users/payments/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://stockz.ai$request_uri;
    }
}

# --- HTTPS: canonical host ---
server {
    listen 443 ssl http2;
    server_name stockz.ai;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    root /var/www/frontend;
    index index.html;

    location /.well-known/ {
        alias /var/www/frontend/.well-known/;
        default_type text/plain;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /staticfiles/ {
        alias /backend/staticfiles/;
    }

    location /media/ {
        alias /backend/media/;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes (landing page, backtest, legal pages and the app). Only one URL form per page:
    # "/backtest/" redirects to "/backtest" (the API and admin keep their trailing slashes via the blocks above).
    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri /index.html;
    }
}
