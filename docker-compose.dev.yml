
services:
  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env.dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file: ./backend/.env.dev
    networks:
      - default
      - SA-network-DEV
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: celery -A stockzAI worker -l info -Q web
    networks:
      - default
      - SA-network-DEV
    env_file: ./backend/.env.dev

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: celery -A stockzAI beat -l info
    networks:
      - default
      - SA-network-DEV
    env_file: ./backend/.env.dev

  
  frontend:
    stdin_open: true
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file: ./frontend/.env.dev
    ports:
      - 5173:5173
    depends_on:
      - backend

networks:
  SA-network-DEV:
    external: true