services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend
    ports: 
      - '8000:8000'
    volumes:
      - ./backend:/app

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    container_name: frontend
    ports:
      - '5173:5173'
    stdin_open: true
    tty: true
    volumes:
      - .frontend:/app
